<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" class="hidden" id="container">
        <header>
            <h1>Weather</h1>
            
        </header>

        <div class="city">
            <h1 id="cityname"></h1>
            <div class="search">
                <input type="text" id="cityinput">
            <button onclick="City()">Search</button>
            </div>
        </div>

        <div class="temperature">
            <h1 id="temp"></h1>
            <img src="" alt="" id="icon">
        </div>

        <div class="otherinfo">
            <div class="humidity">
                <p id="humidity"></p>   
            </div>
            <div class="wind">
                <p id="wind"></p>
            </div>
            <div class="feels">
                <p id="feel"></p>
            </div>
        </div>
    </div>
    <div id="offline" class="hidden" >
        <span>🌐</span><br> No Internet Connection
    </div>

    <script src="script.js"></script>
</body>
</html>
